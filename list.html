<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お気に入りリスト</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>私のお気に入り</h1>
    <div>
        <input type="text" id="input-category" placeholder="カテゴリ（例：好きな食べ物）">
        <input type="text" id="input-value" placeholder="内容（例：カレー）">
        <input type="text" id="input-reason" placeholder="理由（例：辛いから）">
        <button id="add-btn">追加する</button>
    </div>
    <ul id="favorite-list"></ul>
    <p><a href="index.html">トップに戻る</a></p>

    <script>
        const favorites = loadFavorites();

function saveFavorites() {
  localStorage.setItem("favorites", JSON.stringify(favorites));
}

function loadFavorites() {
  const saved = localStorage.getItem("favorites");
  if (saved === null) {
    return [
      { category: "好きな食べ物", value: "カレー", reason: "辛いものが好きだから" },
      { category: "好きな色",     value: "青",     reason: "空の色だから" },
      { category: "好きな音楽",   value: "J-POP",  reason: "歌詞が心に残るから" },
      { category: "好きな場所",   value: "図書館", reason: "静かで集中できるから" }
    ];
  }
  return JSON.parse(saved);
}

        const ul = document.getElementById("favorite-list");

        function render() {
            ul.innerHTML = "";
            for (let i = 0; i < favorites.length; i++) {
                const li = document.createElement("li");
                li.textContent = `${favorites[i].category}：${favorites[i].value}（${favorites[i].reason}）`;
                ul.appendChild(li);
            }
        }

        render();

        document.getElementById("add-btn").addEventListener("click", () => {
            const category = document.getElementById("input-category").value;
            const value = document.getElementById("input-value").value;
            const reason = document.getElementById("input-reason").value;

            if (category === "" || value === "") {
                alert("カテゴリと内容は入力してください");
                return;
            }

            favorites.push({ category, value, reason });
            saveFavorites();
            render();

            document.getElementById("input-category").value = "";
            document.getElementById("input-value").value = "";
            document.getElementById("input-reason").value = "";
        });

    </script>
</body>

</html>
